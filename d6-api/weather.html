<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 동네 날씨</title>
<style>
  body { font-family: system-ui, sans-serif; background: #eef4fb; margin: 0; padding: 24px 16px; color: #1c2b3a; }
  main { max-width: 420px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .card { background: #fff; border-radius: 16px; padding: 24px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .emoji { font-size: 72px; line-height: 1; }
  .temp { font-size: 48px; font-weight: 700; margin: 8px 0 0; }
  .text { font-size: 20px; margin: 4px 0 0; }
  .time { font-size: 13px; color: #6b7c8d; margin-top: 12px; }
  .error { color: #c0392b; }
  .api-box { background: #fff; border-radius: 12px; padding: 16px; margin-top: 16px; font-size: 13px; word-break: break-all; }
  .api-box h2 { font-size: 15px; margin: 0 0 8px; }
  .source { font-size: 12px; color: #6b7c8d; margin-top: 16px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>🌤️ <span id="place"></span> 날씨</h1>

  <div class="card" id="card">불러오는 중...</div>

  <div class="api-box">
    <h2>🔌 이 화면이 쓰는 API</h2>
    <div id="api-url"></div>
    <a id="api-link" target="_blank" rel="noopener">새 탭에서 원본 JSON 보기</a>
  </div>

  <p class="source">Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a></p>
</main>

<script>
  // 🔌 API 주소는 여기 한 곳에만 둔다. latitude/longitude 숫자를 바꾸면 다른 도시 날씨가 나온다.
  const PLACE = "서울";  // 🔌 화면에 보여 줄 동네 이름 (○○ 자리에 우리 동네를 넣으세요)
  const API = {
    weather: "https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.978&current=temperature_2m,weather_code&timezone=auto", // 🔌 현재 기온 + 날씨 코드
  };

  // WMO 날씨 코드 → [말, 이모지]
  const WEATHER = {
    0: ["맑음", "☀️"],
    1: ["대체로 맑음", "🌤️"],
    2: ["구름 조금", "⛅"],
    3: ["흐림", "☁️"],
    45: ["안개", "🌫️"],
    48: ["서리 안개", "🌫️"],
    51: ["약한 이슬비", "🌦️"],
    53: ["이슬비", "🌦️"],
    55: ["강한 이슬비", "🌦️"],
    56: ["약한 어는 이슬비", "🌧️"],
    57: ["강한 어는 이슬비", "🌧️"],
    61: ["약한 비", "🌧️"],
    63: ["비", "🌧️"],
    65: ["강한 비", "🌧️"],
    66: ["약한 어는 비", "🌧️"],
    67: ["강한 어는 비", "🌧️"],
    71: ["약한 눈", "🌨️"],
    73: ["눈", "❄️"],
    75: ["강한 눈", "❄️"],
    77: ["싸락눈", "🌨️"],
    80: ["약한 소나기", "🌦️"],
    81: ["소나기", "🌧️"],
    82: ["강한 소나기", "⛈️"],
    85: ["약한 소낙눈", "🌨️"],
    86: ["강한 소낙눈", "❄️"],
    95: ["뇌우", "⛈️"],
    96: ["우박 동반 뇌우", "⛈️"],
    99: ["강한 우박 동반 뇌우", "⛈️"],
  };

  document.getElementById("place").textContent = PLACE;
  document.getElementById("api-url").textContent = API.weather;
  document.getElementById("api-link").href = API.weather;

  async function loadWeather() {
    const card = document.getElementById("card");
    card.textContent = "불러오는 중...";
    try {
      const res = await fetch(API.weather); // 🔌 API 호출
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const { temperature_2m: temp, weather_code: code, time } = data.current;
      const [text, emoji] = WEATHER[code] || ["알 수 없음 (코드 " + code + ")", "❓"];
      card.innerHTML =
        '<div class="emoji">' + emoji + '</div>' +
        '<div class="temp">' + temp + '°C</div>' +
        '<div class="text">' + text + '</div>' +
        '<div class="time">기준 시각: ' + time.replace("T", " ") + '</div>';
    } catch (err) {
      card.innerHTML = '<div class="error">⚠️ 날씨를 불러오지 못했어요.<br>잠시 뒤 새로고침해 주세요.</div>';
      console.error(err);
    }
  }

  loadWeather();
</script>
</body>
</html>
